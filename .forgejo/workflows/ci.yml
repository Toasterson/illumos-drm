# Solstice CI (Forgejo Actions), set up like illumos-ddi's workflow.
# Constraints of the runner: no `uses:`, no `needs:`, no `if:`, no
# artifacts; steps run as `sh -lc`; the runner clones the repository at the
# pushed commit before the first step and runs every step from its root.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-hosted:
    # Type-check, lint, format-check, document and run the host tests
    # against the hosted illumos target. The toolchain pinned in
    # rust-toolchain.toml goes into a private rustup in $HOME.
    runs-on: rust
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          sh -s -- -y --profile minimal --default-toolchain none --no-modify-path &&
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 &&
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo check --workspace --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo clippy --workspace --target x86_64-unknown-illumos -- -D warnings
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo fmt --all -- --check
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude xtask --no-deps --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo test -p drm-core -p drm-uapi -p drm-facade && cargo test -p virtio_gpu --no-default-features
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo xtask uapi-check tools/uapi/drm_layout.oibldofgate.out
      # The facade's layouts in Rust (drm-facade-sys) against gcc's on
      # illumos (tools/facade/facade_layout.c compiled with gcc -S).
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo xtask facade-check tools/facade/facade_layout.illumos.out

  kmod-illumos:
    # Native illumos: install the pinned nightly (the only nightly-only step
    # is -Zbuild-std), build the modules for the kernel target and link them
    # with the illumos ld as real kernel modules.
    runs-on: illumos
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          --default-toolchain nightly-2026-04-16 --component rust-src --no-modify-path
      # misc/drm, the DRM core and the C facade: linked with drm.mapfile,
      # which must leave exactly _init, _fini, _info and the facade's
      # functions global (-B reduce), with the facade's CTF where the
      # gate's ctfconvert is installed (developer/build/onbld).
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build --locked -p drm --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
      - run: >
          ctf= &&
          if [ -x /opt/onbld/bin/i386/ctfconvert ]; then
          OUT=target modules/drm/ctf/build-ctf.sh && ctf="-z defaultextract target/drm_facade_ctf.o";
          else echo "no ctfconvert: misc/drm without CTF"; fi &&
          ld -ztype=kmod -N fs/specfs -B reduce -M modules/drm/drm.mapfile -z allextract
          target/x86_64-illumos-kmod/release/drm.a $ctf -o target/drm &&
          elfdump -d target/drm | grep SUNW_KMOD && nm -u target/drm &&
          nm target/drm | awk -F'|' '$5 ~ /GLOB/ && $7 !~ /UNDEF/ {gsub(/ /, "", $8); print $8}' | sort > target/drm.globals &&
          awk '/global:/ {g=1; next} /local:/ {g=0} g && /;/ {gsub(/[;\t ]/, ""); print}' modules/drm/drm.mapfile | sort > target/drm.want &&
          diff target/drm.want target/drm.globals && echo "misc/drm: $(wc -l < target/drm.globals) global symbols, as drm.mapfile"
      # The Rust drivers, linked against misc/drm (-N misc/drm). Neither may
      # carry a symbol of drm-core's stateful modules, which only misc/drm
      # builds (feature "kernel"): the core runs once, in misc/drm.
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build --locked -p rdrmnull --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem &&
          cargo +nightly-2026-04-16 build --locked -p virtio_gpu --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
      - run: >
          ld -ztype=kmod -N fs/specfs -N misc/drm -z allextract
          target/x86_64-illumos-kmod/release/rdrmnull.a -o target/rdrmnull &&
          ld -ztype=kmod -N misc/virtio -N fs/specfs -N misc/drm -z allextract
          target/x86_64-illumos-kmod/release/virtio_gpu.a -o target/virtio_gpu &&
          for m in rdrmnull virtio_gpu; do
          elfdump -d target/$m | grep SUNW_KMOD && nm -u target/$m &&
          n=$(nm target/$m | awk -F'|' '$5 ~ /GLOB/ && $7 !~ /UNDEF/ && $8 ~ /8drm_core(3gem|5fence|9fence_dev|4resv|5slots|7syncobj|14syncobj_ioctl|5prime|5ioctl|6device|5state|8anon_fd|5minor|7objects|6idmap|7dmaerr|4caps|9sync_file|8uaccess|7wwmutex|6driver)/' | wc -l) &&
          echo "$m: $n stateful core symbols" && test "$n" -eq 0 || exit 1; done
      # cdrmnull, the C driver: gcc with the gate's kernel flags, linked
      # with -N misc/drm -z defs against the gate's ddi.mapfile (of the
      # gate commit ddi-sys is pinned to), the facade's mapfile and its
      # private.mapfile.
      - run: >
          curl -sSf -o target/ddi.mapfile
          https://raw.githubusercontent.com/illumos/illumos-gate/cda5b9a49f77a86a151a20cdde0e948a49b37160/usr/src/uts/common/mapfiles/ddi.mapfile &&
          DDI_MAPFILE=target/ddi.mapfile OUT=target/cdrmnull drivers/cdrmnull/build.sh &&
          elfdump -d target/cdrmnull/cdrmnull | grep SUNW_KMOD
