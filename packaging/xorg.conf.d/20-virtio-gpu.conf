#
# Xorg on a virtio-gpu device: the modesetting driver on the DRM card node
# of virtio_gpu, with glamor (OpenGL acceleration through Mesa's
# virtio_gpu driver, virgl) when the device has 3D. OpenIndiana's Xorg
# 1.19.7 is built without glamor: modesetting then logs "No glamor
# support in the X Server" and draws in software, and GLX uses softpipe.
#
# modesetting claims the PCI device whose DRM bus ID (pci:DDDD:BB:DD.F,
# which virtio_gpu reports from its reg property) matches, after opening
# the node named by kmsdev. A guest that also has a VGA device may need
# the ServerLayout of /etc/X11/xorg.conf to name this device only.
Section "Device"
	Identifier	"virtio-gpu"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card0"
	Option		"AccelMethod"	"glamor"
EndSection
