[package]
name = "rdrmnull"
description = "A DRM null driver: one device with card and render nodes, GEM objects and dumb buffers in system memory and no hardware, for testing the core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# Test aid, off by default: allows dma-mode="root-node", which panics the
# system on purpose (see the crate documentation). Without it that mode is
# refused at attach and the module cannot name another node at all.
panic-drill = ["drm/panic-drill"]

[dependencies]
# global-alloc-sleep: the DRM core keeps its handle and name tables in
# alloc::collections::BTreeMap, whose nodes come from the global allocator;
# the core only inserts with the Sleepable token (see drm::idmap).
ddi = { workspace = true, features = ["panic-handler", "global-alloc-sleep"] }
drm.workspace = true
drm-uapi.workspace = true

[package.metadata.kmod]
# Install class: /usr/kernel/drv/amd64/rdrmnull
class = "drv"
conf = "rdrmnull.conf"
depends = []
