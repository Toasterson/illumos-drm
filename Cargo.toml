[workspace]
resolver = "3"
members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull", "xtask"]
default-members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "crates/drm-uapi" }
drm = { path = "crates/drm" }
# illumos-ddi at the head of its r2-private-fd branch: its r3-kms-glue
# branch (clone opens, the devmap(9E) entry point, OwnNode, and chpoll(9E)
# in the CharDevice glue with pinned pollheads, which the KMS event queue
# needs) plus the private tier (file descriptors for dma-bufs, sync
# objects and sync files), the segmap(9E) check, PollBox and the
# thread-context drop rule for pollheads. Move the pin to the merge commit
# on illumos-ddi main once those branches are merged.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "faec57598b4b73fbf8f2971871a62ad5737a39d7" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "faec57598b4b73fbf8f2971871a62ad5737a39d7", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

