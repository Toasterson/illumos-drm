[workspace]
resolver = "3"
members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull", "drivers/virtio-gpu", "xtask"]
default-members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull", "drivers/virtio-gpu"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "crates/drm-uapi" }
drm = { path = "crates/drm" }
# illumos-ddi at the head of its r4-virtio branch: its r2-private-fd
# branch (clone opens, the devmap(9E) entry point, OwnNode, chpoll(9E),
# the private tier for dma-bufs, sync objects and sync files, PollBox)
# plus the private crate for the virtio framework and its safe wrapper
# ddi::private::virtio (feature unstable-gate-cda5b9a49f-virtio), which the
# virtio-gpu driver needs. Move the pin to the merge commit on
# illumos-ddi main once those branches are merged.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "be7845567053f61a635f9d47176676e6f0cd05ff" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "be7845567053f61a635f9d47176676e6f0cd05ff", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

