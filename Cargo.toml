[workspace]
resolver = "3"
members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull", "xtask"]
default-members = ["crates/drm-uapi", "crates/drm", "examples/rdrmnull"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "crates/drm-uapi" }
drm = { path = "crates/drm" }
# illumos-ddi at the head of its loose-ends-20260928 branch: main (clone
# opens and the devmap(9E) entry point in the CharDevice glue, which the
# DRM core needs for per-file state and GEM mmap, and OwnNode, the
# capability DMA handles are allocated from) plus OwnNode for minor nodes,
# property updates and LDI identifiers. Move the pin to the merge commit on
# illumos-ddi main once that branch is merged.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "eb0150cadc8e27c03c163235d0295705c7588253" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "eb0150cadc8e27c03c163235d0295705c7588253", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

