[workspace]
resolver = "3"
members = [
    "crates/drm-uapi",
    "crates/drm-facade-sys",
    "crates/drm-core",
    "crates/drm-facade",
    "modules/drm_core",
    "examples/rdrmnull",
    "drivers/virtio-gpu",
    "xtask",
]
default-members = [
    "crates/drm-uapi",
    "crates/drm-facade-sys",
    "crates/drm-core",
    "crates/drm-facade",
    "modules/drm_core",
    "examples/rdrmnull",
    "drivers/virtio-gpu",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "crates/drm-uapi" }
drm-core = { path = "crates/drm-core", default-features = false }
drm-facade = { path = "crates/drm-facade" }
drm-facade-sys = { path = "crates/drm-facade-sys" }
# illumos-ddi at the head of its g7-module-busy branch (stacked on
# r5a-char-table, which is stacked on g1-gate-pin, which is stacked on
# r4-virtio): clone opens, the
# devmap(9E) entry point, OwnNode, chpoll(9E), the private tier for
# dma-bufs, sync objects and sync files, PollBox, the virtio framework
# (feature unstable-gate-cda5b9a49f-virtio) as pinned and checked at
# illumos 7e802e88a3, and for R5a the CharTable glue with which misc/drm_core
# serves the character devices other driver modules attach, the cb_ops:
# form of module!, Driver::load, FileRef::char_dev,
# TaskQueue::without_node, IntrPriority::new, current_context,
# servicing_interrupt and module_loaded (for G7: a module only in memory
# after a failed _init does not count). Move
# the pin to the merge commit on illumos-ddi main once those branches are
# merged.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "983751f3c88d40771dddc0494ca970466d46e892" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "983751f3c88d40771dddc0494ca970466d46e892", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

