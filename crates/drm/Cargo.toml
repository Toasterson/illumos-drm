[package]
name = "drm"
description = "The DRM core for illumos: device registration, card and render nodes, per-file state, core ioctls, GEM objects and dumb buffers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Test aid, off by default: lets GemDma::against name a device node other
# than the driver's own, bypassing illumos-ddi's own-node rule with raw
# ddi_dma_alloc_handle(9F) calls. It exists only so that the rdrmnull DMA
# drill can reproduce the 2026-09-28 root-node panic on a disposable VM.
# A production build must not enable it.
panic-drill = []

[dependencies]
ddi.workspace = true
drm-uapi.workspace = true

[package.metadata.kmod]
# The core is a library linked into each driver module; it needs nothing
# beyond genunix and unix.
depends = []
