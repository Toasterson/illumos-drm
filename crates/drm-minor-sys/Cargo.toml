[package]
name = "drm-minor-sys"
description = "Raw bindings to misc/drm_minor, the kernel module that numbers the DRM devices of every illumos-drm driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[package.metadata.kmod]
# The functions resolve from the misc/drm_minor module (modules/drm-minor),
# so every driver linked against the core names it with -N.
depends = ["misc/drm_minor"]
